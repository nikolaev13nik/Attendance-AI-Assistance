# Deliberately does NOT import async-messages.yml: with no stream bindings declared, nothing names a
# destination to connect to. That alone is not enough, though - Spring Cloud Stream auto-detects the single
# Consumer bean as the function definition, binds userStatisticAnalysis-in-0 and lets the Kafka provisioner
# dial localhost:9092 during context refresh. Switching off its two core autoconfigurations is what keeps
# the test context broker-free; the other three stream autoconfigurations are @ConditionalOnBean on beans
# these declare, so they back off by themselves. The consumer is exercised by constructing it directly and
# handing it a Message<>, which is how TimeTracking tests its own consumer.
spring.autoconfigure.exclude=\
  org.springframework.cloud.stream.config.BindingServiceConfiguration,\
  org.springframework.cloud.stream.function.FunctionConfiguration
att.ai.analysis.history-months=6
# JavaMailSender is replaced by a mock in the tests, so the host is never dialled.
spring.mail.host=localhost
spring.mail.port=2525
att.ai.notification.from=no-reply@attendance.test
att.ai.notification.enabled=true
# Also off in main config, for a production reason; here it additionally matters because the mocked
# JavaMailSender is not a JavaMailSenderImpl, which is what the contributor looks for.
management.health.mail.enabled=false
logging.level.att.ai=DEBUG
