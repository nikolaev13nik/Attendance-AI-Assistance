# This service has no REST API and no database: its only input is Kafka and its only output is email.
# Mail and the analysis settings arrive in later steps.

# All Kafka bindings live in async-messages.yml. 'optional:' means the app still starts if that file
# is absent, which is what lets tests run without any messaging config.
spring.config.import=optional:classpath:async-messages.yml

# Lets tests (and a local run with no broker) switch the subscriber off.
att.ai.messaging.analysis.enabled=true

# Months of history to put in the LLM prompt, newest first. TimeTracking sends the target month plus the
# 6 before it (7 entries), so the default of 6 drops the oldest one. Set this to 7 to use everything sent.
att.ai.analysis.history-months=6

# SMTP. Every value is environment-specific, so all of it comes from env vars - there is no usable default
# for a mail server. With MAIL_HOST unset, sending fails and the binder retries; set MAIL_ENABLED=false to
# run the pipeline without sending anything.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
# Connect/read timeouts matter here: without them a hung SMTP server blocks the Kafka consumer thread.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

att.ai.notification.from=${MAIL_FROM:no-reply@attendance.local}
att.ai.notification.enabled=${MAIL_ENABLED:true}

management.endpoints.web.exposure.include=health
management.endpoint.shutdown.enabled=true

logging.level.att.ai=DEBUG
