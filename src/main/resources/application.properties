spring.config.import=optional:classpath:async-messages.yml

att.ai.analysis.history-months=6
att.ai.llm.provider=${ATT_AI_LLM_PROVIDER:stub}
att.ai.llm.model=${ATT_AI_LLM_MODEL:claude-sonnet-5}
att.ai.llm.max-tokens=${ATT_AI_LLM_MAXTOKENS:4000}
att.ai.llm.timeout-seconds=${ATT_AI_LLM_TIMEOUTSECONDS:40}
att.ai.llm.max-retries=${ATT_AI_LLM_MAXRETRIES:1}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

att.ai.notification.from=${MAIL_FROM:no-reply@attendance.local}
att.ai.notification.enabled=${MAIL_ENABLED:true}
management.health.mail.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.shutdown.enabled=true

logging.level.att.ai=DEBUG
