namespace: attendance

replicaCount: 1

image:
  repository: ghcr.io/nikolaev13nik/attendance-ai-assistance
  tag: ""
  pullPolicy: IfNotPresent

containerPort: 8080

config:
  name: attendance-config
secret:
  name: attendance-secrets

kafkaBootstrapServersKey: KAFKA_BOOTSTRAP_SERVERS

mail:
  port: "587"
  smtpAuth: "true"
  starttls: "true"
  enabled: "true"
  hostKey: MAIL_HOST
  fromKey: MAIL_FROM
  usernameKey: MAIL_USERNAME
  passwordKey: MAIL_PASSWORD

analysis:
  historyMonths: "7"

llm:
  provider: "anthropic"
  model: "claude-sonnet-5"
  maxTokens: "4000"
  timeoutSeconds: "40"
  maxRetries: "1"
  apiKeyKey: ANTHROPIC_API_KEY

javaToolOptions: "-XX:MaxRAMPercentage=75"

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

strategy:
  maxSurge: 1
  maxUnavailable: 0

probes:
  path: /actuator/health
  startup:
    periodSeconds: 5
    failureThreshold: 48
  readiness:
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    periodSeconds: 30
    failureThreshold: 3
