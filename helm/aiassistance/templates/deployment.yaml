apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiassistance
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.strategy.maxSurge }}
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}

  selector:
    matchLabels:
      app: aiassistance
  template:
    metadata:
      labels:
        app: aiassistance
    spec:
      containers:
        - name: aiassistance

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.containerPort }}

          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.javaToolOptions | quote }}

            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.config.name }}
                  key: {{ .Values.kafkaBootstrapServersKey }}

            {{- range $key := list "MAIL_PORT" "MAIL_SMTP_AUTH" "MAIL_SMTP_STARTTLS" "MAIL_ENABLED" }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: aiassistance-config
                  key: {{ $key }}
            {{- end }}

            - name: ATT_AI_ANALYSIS_HISTORYMONTHS
              valueFrom:
                configMapKeyRef:
                  name: aiassistance-config
                  key: ATT_AI_ANALYSIS_HISTORYMONTHS

            {{- range $key := list "ATT_AI_LLM_PROVIDER" "ATT_AI_LLM_MODEL" "ATT_AI_LLM_MAXTOKENS" "ATT_AI_LLM_TIMEOUTSECONDS" "ATT_AI_LLM_MAXRETRIES" }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: aiassistance-config
                  key: {{ $key }}
            {{- end }}

            {{- range $env, $key := dict "MAIL_HOST" .Values.mail.hostKey "MAIL_FROM" .Values.mail.fromKey "MAIL_USERNAME" .Values.mail.usernameKey "MAIL_PASSWORD" .Values.mail.passwordKey }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secret.name }}
                  key: {{ $key }}
                  optional: true
            {{- end }}

            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.llm.apiKeyKey }}
                  optional: false

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          startupProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.containerPort }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.containerPort }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.containerPort }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
